name: Debug

on:
  workflow_dispatch:
    inputs:
      clojureRepo:
        description: "Repository name with owner."
        required: true
        default: 'clojure/clojure'
      clojureRef:
        description: "The branch, tag or SHA to checkout"
        required: true
        default: 'master'

jobs:

  test-meander:
    uses: ./.github/workflows/deps-test.yml
    with:
      clojureRepo: ${{ inputs.clojureRepo }}
      clojureRef: ${{ inputs.clojureRef }}
      subjectRepo: 'noprompt/meander'
      subjectRef: 'epsilon'
      testDir: '.'
      testCmd: >-
        -M:cljs:test -e
        "(require 'eftest.runner)
        (let [{:keys [fail error]} (eftest.runner/run-tests (eftest.runner/find-tests \"test\"))]
          (System/exit (if (zero? (+ fail error)) 0 1)))"
